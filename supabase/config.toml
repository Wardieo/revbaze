[functions.billing]
# Authentication is explicitly verified with Auth.getUser inside the handler.
verify_jwt = false
[functions.paymongo-webhook]
# Only a valid Paymongo-Signature can enter reconciliation.
verify_jwt = false

[functions.review-events]
# Public tracking validates published cards and enabled destinations server-side.
verify_jwt = false

[functions.contact-message]
# Public contact endpoint validates payloads and applies private database rate limits.
verify_jwt = false

[functions.workspace-invite]
# Owner identity is verified explicitly before the private reservation RPC.
verify_jwt = false

[functions.image-upload]
# Verified Auth identity and service-only quota reservation precede upload.
verify_jwt = false

[functions.asset-cleanup]
# Requires the dedicated secret held by the scheduled worker.
verify_jwt = false

[functions.billing-renewals]
# Scheduled FX repricing/reconciliation requires a dedicated worker secret.
verify_jwt = false
